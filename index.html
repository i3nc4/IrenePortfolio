<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ic-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3ff" />
    <meta
      name="description"
      content="Personal portfolio of Irene Concepcion — a fourth-year BSIT student at La Consolacion University Philippines, open to internship opportunities."
    />
    <meta name="author" content="Irene Concepcion" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Irene Concepcion — Aspiring IT Professional" />
    <meta
      property="og:description"
      content="Portfolio of Irene Concepcion featuring her capstone project, technical skills, education, and contact information."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Irene Concepcion Portfolio</title>

    <script>
      // Apply the saved/system theme before paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This portfolio works best with JavaScript enabled. Please enable JavaScript to view it.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
